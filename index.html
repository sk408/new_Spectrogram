<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Spectrogram — Hearing Counseling Tool</title>
    <link rel="stylesheet" href="spectrogram.css">
</head>

<body>
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
        <canvas id="canvas-overlay"></canvas>
    </div>

    <div id="status"></div>

    <button id="presentation-btn" title="Presentation Mode (P)">&#9654;</button>
    <button id="fullscreen-btn" title="Fullscreen (F)">&#x26F6;</button>
    <button id="settings-toggle" title="Settings (Esc)">&#9881;</button>

    <div id="settings-panel" class="hidden">
        <div class="panel-header">
            <h2>Settings</h2>
            <button id="settings-close" title="Close">&times;</button>
        </div>

        <fieldset>
            <legend>Audiogram</legend>
            <div class="control-row">
                <label for="audiogram-enable">Enable Overlay</label>
                <input type="checkbox" id="audiogram-enable">
            </div>
            <div class="control-row">
                <label for="audiogram-preset">Preset</label>
                <select id="audiogram-preset">
                    <option value="normal">Normal Hearing</option>
                    <option value="mild_high_freq">Mild High-Freq Loss</option>
                    <option value="moderate_sloping">Moderate Sloping</option>
                    <option value="severe_high_freq">Severe High-Freq Loss</option>
                    <option value="presbycusis" selected>Presbycusis (Age)</option>
                    <option value="cookie_bite">Cookie Bite</option>
                    <option value="noise_induced">Noise-Induced</option>
                    <option value="flat_moderate">Flat Moderate</option>
                </select>
            </div>
            <div class="control-row">
                <label for="audiogram-ear">Ear</label>
                <select id="audiogram-ear">
                    <option value="both" selected>Both (worst)</option>
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                </select>
            </div>
            <div id="audiogram-grid">
                <div class="grid-header">
                    <span></span>
                    <span>250</span><span>500</span><span>1k</span>
                    <span>2k</span><span>4k</span><span>8k</span>
                </div>
                <div class="grid-row" data-ear="left">
                    <span class="ear-label">L</span>
                    <input type="number" min="-10" max="120" step="5" data-freq="0">
                    <input type="number" min="-10" max="120" step="5" data-freq="1">
                    <input type="number" min="-10" max="120" step="5" data-freq="2">
                    <input type="number" min="-10" max="120" step="5" data-freq="3">
                    <input type="number" min="-10" max="120" step="5" data-freq="4">
                    <input type="number" min="-10" max="120" step="5" data-freq="5">
                </div>
                <div class="grid-row" data-ear="right">
                    <span class="ear-label">R</span>
                    <input type="number" min="-10" max="120" step="5" data-freq="0">
                    <input type="number" min="-10" max="120" step="5" data-freq="1">
                    <input type="number" min="-10" max="120" step="5" data-freq="2">
                    <input type="number" min="-10" max="120" step="5" data-freq="3">
                    <input type="number" min="-10" max="120" step="5" data-freq="4">
                    <input type="number" min="-10" max="120" step="5" data-freq="5">
                </div>
            </div>
            <div class="control-row">
                <label for="show-phonemes">Speech Banana</label>
                <input type="checkbox" id="show-phonemes" checked>
            </div>
        </fieldset>

        <fieldset>
            <legend>Appearance</legend>
            <div class="control-row">
                <label for="scale">Scale</label>
                <select id="scale">
                    <option value="Linear">Linear</option>
                    <option value="Mel" selected>Mel</option>
                </select>
            </div>
            <div class="control-row">
                <label for="colormap">Colormap</label>
                <select id="colormap"></select>
            </div>
            <div class="control-row">
                <label for="speed">Speed</label>
                <select id="speed">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4" selected>4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>
        </fieldset>

        <fieldset>
            <legend>Spectrogram</legend>
            <div class="control-row">
                <label for="db-mode">Level Display</label>
                <select id="db-mode">
                    <option value="HL" selected>dB HL (Hearing Level)</option>
                    <option value="SPL">dB SPL (Sound Pressure)</option>
                </select>
            </div>
            <div class="control-row">
                <label for="sizeFFT">Buffer Size</label>
                <select id="sizeFFT">
                    <option value="2048">2048</option>
                    <option value="4096">4096</option>
                    <option value="8192" selected>8192</option>
                </select>
            </div>
            <div class="control-row">
                <label for="f_min">Min Freq (Hz)</label>
                <input id="f_min" type="number" min="0" max="20000" value="0">
            </div>
            <div class="control-row">
                <label for="f_max">Max Freq (Hz)</label>
                <input id="f_max" type="number" min="0" max="20000" value="9000">
            </div>
        </fieldset>

        <fieldset>
            <legend>General</legend>
            <div class="control-row">
                <label for="sensibility">Sensitivity</label>
                <div class="range-group">
                    <input id="sensibility" type="range" value="60" min="10" max="120">
                    <output id="output_sensibility">60</output>
                    <span>dB</span>
                </div>
            </div>
            <div class="control-row">
                <label for="auto-ranging">Auto-range</label>
                <input type="checkbox" id="auto-ranging" checked>
            </div>
            <div class="control-row">
                <label for="scrolling">Scrolling</label>
                <input type="checkbox" id="scrolling" checked>
            </div>
            <div class="control-row">
                <label for="stop">Pause</label>
                <input type="checkbox" id="stop">
            </div>
            <div class="control-row">
                <label for="window">Window</label>
                <select id="window">
                    <option value="None">None</option>
                    <option value="Cosine">Cosine</option>
                    <option value="Hanning">Hanning</option>
                    <option value="BH7" selected>Blackman-Harris 7</option>
                </select>
            </div>
            <div class="control-row">
                <label for="FFT">FFT Engine</label>
                <select id="FFT">
                    <option value="myFFT" selected>Custom FFT</option>
                    <option value="WebAudio">Web Audio</option>
                </select>
            </div>
            <div class="control-row">
                <label for="microphone">Microphone</label>
                <select id="microphone"></select>
            </div>
        </fieldset>

        <div class="panel-actions">
            <button id="screenshot-btn">Screenshot (S)</button>
            <button id="info-btn">Info</button>
        </div>

        <div class="shortcuts-hint">
            Space: pause &middot; S: screenshot &middot; F: fullscreen &middot; P: present &middot; Esc: close
        </div>
    </div>

    <!-- Info Modal -->
    <div id="info-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>System Info</h3>
                <button class="modal-close">&times;</button>
            </div>
            <pre id="info-text"></pre>
        </div>
    </div>

    <!-- Recording bar -->
    <div id="rec-bar">
        <button id="rec-btn" title="Record a voice sample">&#9210; REC</button>
        <button id="rec-stop-btn" title="Stop recording" class="hidden">&#9632; Stop</button>
        <span id="rec-timer" class="hidden">0:00</span>
        <button id="play-normal-btn" title="Play back normally" disabled>&#9654; Normal</button>
        <button id="play-loss-btn" title="Play back with hearing loss applied" disabled>&#9654; With Loss</button>
        <button id="play-stop-btn" title="Stop playback" disabled>&#9632;</button>
        <label class="rec-label" for="playback-gain">Vol</label>
        <input type="range" id="playback-gain" min="0" max="3" step="0.05" value="1">
        <output id="playback-gain-out">1.0</output>
        <span id="rec-status">No recording</span>
    </div>

    <script src="js-colormaps.js"></script>
    <script src="audiogram.js"></script>
    <script src="spectrogram.js"></script>
    <script src="filter-bank.js"></script>
    <script src="recording.js"></script>
</body>

</html>
